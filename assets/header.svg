    </g>
    <text x="1080" y="178" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="52" font-weight="600" fill="none" stroke="url(#accent)" stroke-width="2.2">&lt;/&gt;</text>
    <text x="72" y="92" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="17" fill="#58a6ff" letter-spacing="1">~/sr-batata000</text>
    <text x="70" y="168" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="76" font-weight="700" fill="#f0f6fc" letter-spacing="-1">João Miguel</text>
    <text x="72" y="214" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" fill="#c9d1d9"><tspan>Developer</tspan><tspan fill="#58a6ff" dx="10">|</tspan><tspan fill="#79c0ff" dx="10">Em aprendizado</tspan></text>
    <rect x="72" y="234" width="72" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="274" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-style="italic" fill="#8b949e">“Grandes sonhos exigem constância, não perfeição.”</text>
    <rect x="0" y="317" width="1200" height="3" fill="url(#edge)"/>
