      <polygon points="1044,160 1002,232.7 918,232.7 876,160 918,87.3 1002,87.3" stroke="#58a6ff" stroke-width="1.5" opacity="0.9" transform="translate(120 0)"/>
      <polygon points="1008,160 984,201.6 936,201.6 912,160 936,118.4 984,118.4" stroke="#79c0ff" stroke-width="1" opacity="0.5" transform="translate(120 0)"/>
      <path d="M1020 56 L1090 20 M1140 56 L1200 56 M1200 160 L1250 160 M1140 264 L1200 290 M1020 264 L960 300" stroke="#30363d" stroke-width="1.2" transform="translate(-60 0)"/>
